<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informe Canal Retail 2026 · Xuma</title>
  <meta name="description"
    content="Informe ejecutivo Canal Retail 2026 (corte agosto): visitas de formación, ventas, cobertura de PDV y estrategia de formación." />

  <!-- Leaflet CSS (vendorizado en dash/core/leaflet — sitio autocontenido, sin CDN) -->
  <link rel="stylesheet" href="../core/leaflet/leaflet.css" />

  <link rel="stylesheet" href="styles.css" />
  <style>
    #home-btn {
      position: fixed;
      top: 12px;
      left: 20px;
      z-index: 1001;
      color: rgba(255, 255, 255, .65);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-decoration: none;
      background: rgba(18, 1, 128, .6);
      border: 1px solid rgba(90, 226, 128, .3);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    #home-btn:hover {
      color: #120180;
      background: #5AE280;
      border-color: #5AE280;
    }

    /* Premium Dark themed Leaflet Popups */
    .custom-popup .leaflet-popup-content-wrapper {
      background: rgba(18, 1, 128, 0.95) !important;
      color: #ffffff !important;
      border: 1px solid #5AE280 !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5) !important;
      border-radius: 8px !important;
      padding: 4px 8px !important;
    }

    .custom-popup .leaflet-popup-tip {
      background: rgba(18, 1, 128, 0.95) !important;
      border: 1px solid #5AE280 !important;
    }

    .custom-popup .leaflet-popup-close-button {
      color: rgba(255, 255, 255, 0.7) !important;
    }
    #home-btn { display: none !important; }
    .s-header .s-tag { display: none !important; }
  </style>
</head>

<body>

  <a id="home-btn" href="../index.html" title="Volver al portal de canales">⌂ PORTAL</a>
  <div id="progress" style="width:0"></div>
  <div id="counter">1 / 3</div>
  <button id="prev-btn" title="Anterior (←)">&#8592;</button>
  <button id="next-btn" title="Siguiente (→)">&#8594;</button>

  <div id="app">
    <div id="scaler">

      <!-- ══════════ SLIDE 0 · VISITAS DE FORMACIÓN ══════════ -->
      <div class="slide slide-content active" data-label="Formación">
        <div class="s-header">
          <h2>Ejecución de Visitas de Formación · Ene-Ago 2026</h2>
          <span class="s-tag">Retail · Formación</span>
        </div>
        <div class="s-body" id="formacion-body">
          <!-- Renderizado dinámico -->
        </div>
      </div>

      <!-- ══════════ SLIDE 1 · COBERTURA Y GEOGRAFÍA (fusionado) ══════════ -->
      <div class="slide slide-content" data-label="Cobertura">
        <div class="s-header">
          <h2>Cobertura de Puntos de Venta y Municipios Visitados</h2>
          <span class="s-tag">Retail · Cobertura</span>
        </div>
        <div class="s-body" id="cobertura-body">
          <!-- Renderizado dinámico (cobertura PDV + municipios visitados) -->
        </div>
      </div>

      <!-- ══════════ SLIDE 2 · VENTAS ══════════ -->
      <div class="slide slide-content" data-label="Ventas">
        <div class="s-header">
          <h2>Ventas del Canal · Cuota Protegida y Rueda Seguro</h2>
          <span class="s-tag">Retail · Resultados</span>
        </div>
        <div class="s-body" id="ventas-body">
          <!-- Renderizado dinámico -->
        </div>
      </div>

      </div>

    </div><!-- #scaler -->
  </div><!-- #app -->

  <div id="nav"></div>

  <!-- Leaflet JS (vendorizado, sin CDN) -->
  <script src="../core/leaflet/leaflet.js"></script>

  <!-- Project Data and Scripts -->
  <script src="../core/icons.js"></script>
  <script src="data_retail.js"></script>
  <script src="municipalities_geojson.js"></script>
  <script src="../core/deck-engine.js"></script>
  <script src="app_retail.js"></script>

</body>

</html>
